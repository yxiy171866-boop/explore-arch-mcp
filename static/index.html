                <svg class="svg-icon" style="width: 26px; height: 26px; color: #8c7355;" viewBox="0 0 24 24"><path d="M3 21h18"></path><path d="M5 21V7l7-4 7 4v14"></path><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"></path></svg>
            </div>
            <h2 style="font-family: serif; font-size: 1.35rem; color: #2b2621; margin: 0 0 8px;">欢迎来到建筑漫游</h2>
            <p style="font-size: 0.85rem; color: #786f66; margin: 0 0 24px; line-height: 1.5;">探索世界建筑之美。在开启前，请为你们设置专属的交流称谓：</p>
            
            <div style="text-align: left; margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #5c4d3c; margin-bottom: 6px;">你的名字</label>
                <input id="onboardUserName" type="text" value="我" placeholder="例如：建筑迷" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 12px; border: 1px solid #dfd7cc; background: #faf9f5; font-size: 0.9rem; color: #2b2621; outline: none;">
            </div>

            <div style="text-align: left; margin-bottom: 24px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #5c4d3c; margin-bottom: 6px;">伴侣的名字</label>
                <input id="onboardCompanionName" type="text" value="AI伴侣" placeholder="例如：Claude" style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 12px; border: 1px solid #dfd7cc; background: #faf9f5; font-size: 0.9rem; color: #2b2621; outline: none;">
            </div>

            <button onclick="finishOnboarding()" style="width: 100%; padding: 12px; border-radius: 14px; background: #2b2621; color: #faf9f5; font-size: 0.92rem; font-weight: 500; border: none; cursor: pointer; transition: background 0.2s;">开启漫游之旅</button>
        </div>
    </div>

    <!-- Toast Component -->
    <div class="toast" id="toast">
        <svg class="svg-icon" id="toastIcon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toastMsg">提示消息</span>
    </div>

    <script>
        let currentProject = null;
        let currentNotes = [];
        let isNotesCollapsed = false;
        let currentRandomProject = null;
        let currentDrawerMode = 'history';

        // Carousel items
        let carouselProjects = [];
        let carouselCurrentIndex = 0;

        // User Settings (Stored in localStorage)
        let userSettings = {
            userName: localStorage.getItem('dhome_arch_username') || '我',
            companionName: localStorage.getItem('dhome_arch_companion') || 'AI伴侣',
            language: localStorage.getItem('dhome_arch_lang') || 'zh', // 'zh', 'en', 'bilingual'
        };

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            if (icon) {
                if (type === 'error') {
                    icon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
                } else {
                    icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                }
            }
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        async function loadCurrentProject() {
            try {
                const res = await fetch('/api/architecture/current');
                const data = await res.json();
                if (data.status === 'success') {
                    currentProject = data.project;
                    currentNotes = data.notes || [];
                    renderHero(currentProject, data.is_favorite);
                    renderNotes(currentNotes);
                    await loadCarouselList();
                }
            } catch (err) {
                console.error('Failed to load current project:', err);
                showToast('加载建筑信息失败，请稍后刷新重试');
            }
        }

        // Load Carousel List for Waist Arrow Navigation (Strictly Favorites)
        async function loadCarouselList() {
            try {
                const res = await fetch('/api/architecture/carousel');
                const data = await res.json();
                if (data.status === 'success') {
                    carouselProjects = data.items || [];
                    if (currentProject) {
                        const idx = carouselProjects.findIndex(p => p.id === currentProject.id);
                        carouselCurrentIndex = idx;
                    } else {
                        carouselCurrentIndex = -1;
                    }
                    updateCarouselBadge();
                }
            } catch (err) {
                console.error('Failed to load carousel:', err);
            }
        }

        function updateCarouselBadge() {
            const badge = document.getElementById('carouselCounter');
            const prevBtn = document.getElementById('carouselPrevBtn');
            const nextBtn = document.getElementById('carouselNextBtn');

            if (carouselProjects.length <= 1) {
                if (prevBtn) prevBtn.style.visibility = 'hidden';
                if (nextBtn) nextBtn.style.visibility = 'hidden';

                if (carouselProjects.length === 1 && carouselCurrentIndex >= 0) {
                    badge.style.display = 'inline-block';
                    badge.innerText = '已收藏';
                } else if (currentProject) {
                    badge.style.display = 'inline-block';
                    badge.innerText = '当前展品';
                } else {
                    badge.style.display = 'none';
                }
            } else {
                if (prevBtn) prevBtn.style.visibility = 'visible';
                if (nextBtn) nextBtn.style.visibility = 'visible';

                badge.style.display = 'inline-block';
                if (carouselCurrentIndex >= 0) {
                    badge.innerText = `${carouselCurrentIndex + 1} / ${carouselProjects.length}`;
                } else {
                    badge.innerText = `展品 (${carouselProjects.length} 收藏)`;
                }
            }
        }

        async function navigateCarousel(direction) {
            if (carouselProjects.length <= 1) {
                return;
            }
            if (carouselCurrentIndex < 0) {
                carouselCurrentIndex = 0;
            } else {
                carouselCurrentIndex = (carouselCurrentIndex + direction + carouselProjects.length) % carouselProjects.length;
            }
            const target = carouselProjects[carouselCurrentIndex];
            await switchToProject(target.id);
            updateCarouselBadge();
        }

        function renderHero(p, isFav) {
            let structuredTitle = p.structured_title || p.title;
            let displayTitle = p.title || '建筑作品';
            let displayLocation = p.location || p.city || p.country || '全球';

            if (userSettings.language === 'zh') {
                structuredTitle = p.structured_title_zh || p.structured_title || p.title_zh || p.title;
                displayTitle = p.title_zh || p.title || '建筑作品';
                displayLocation = p.location_zh || p.location || p.city || p.country || '全球';
            } else if (userSettings.language === 'en') {
                structuredTitle = p.structured_title_en || p.structured_title || p.title_en || p.title;
                displayTitle = p.title_en || p.title || 'Architecture';
                displayLocation = p.location_en || p.location || p.city || p.country || 'Global';
            } else if (userSettings.language === 'bilingual') {
                structuredTitle = p.structured_title_zh || p.structured_title;
                displayTitle = (p.title_zh && p.title_en && p.title_zh !== p.title_en)
                    ? `${p.title_zh} / ${p.title_en}`
                    : (p.title_zh || p.title);
                displayLocation = (p.location_zh && p.location_en && p.location_zh !== p.location_en)
                    ? `${p.location_zh} (${p.location_en})`
                    : (p.location_zh || p.location);
            }

            document.getElementById('heroStructuredTitle').innerText = structuredTitle;
            document.getElementById('heroTitle').innerText = displayTitle;
            document.getElementById('heroImage').src = p.cover_image || '';
            document.getElementById('heroArchitect').innerText = p.architect || '未知建筑师';
            document.getElementById('heroLocation').innerText = displayLocation;
            document.getElementById('heroYear').innerText = p.year ? (userSettings.language === 'en' ? p.year : p.year + '年') : (userSettings.language === 'en' ? 'Recent' : '近代');

            // Multi-language Description rendering
            const descEl = document.getElementById('heroDesc');
            const linkEl = document.getElementById('heroSourceLink');
            
            let descText = '';
            const zhText = p.description_zh || p.description || '';
            const enText = p.description_en || '';

            if (userSettings.language === 'en') {
                descText = enText || zhText;
            } else if (userSettings.language === 'bilingual' && zhText && enText && zhText !== enText) {
                descText = `${zhText}\n\n[EN] ${enText}`;
            } else {
                descText = zhText || enText || '精选现代建筑设计作品。';
            }

            descEl.innerText = descText;

            // Source link (Grey)
            if (p.source_url) {
                linkEl.href = p.source_url;
                linkEl.style.display = 'inline-flex';
            } else {
                linkEl.style.display = 'none';
            }

            // Favorite button
            const favBtn = document.getElementById('heroFavBtn');
            if (isFav) favBtn.classList.add('active');
            else favBtn.classList.remove('active');

            // Thumbnail gallery
            const strip = document.getElementById('thumbnailStrip');
            strip.innerHTML = '';
            const imgs = p.images || [];
            if (imgs.length > 1) {
                imgs.forEach((imgUrl, idx) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = 'thumbnail-item' + (idx === 0 ? ' active' : '');
                    thumb.onclick = () => {
                        document.getElementById('heroImage').src = imgUrl;
                        document.querySelectorAll('.thumbnail-item').forEach(t => t.classList.remove('active'));
                        thumb.classList.add('active');
                    };
                    strip.appendChild(thumb);
                });
                strip.style.display = 'flex';
            } else {
                strip.style.display = 'none';
            }
        }

        // Render Paper Notes (Author name on top-left, small and separate from body, trash delete btn)
        function renderNotes(notes) {
            const stream = document.getElementById('notesStream');
            stream.innerHTML = '';
            document.getElementById('notesCountPill').innerText = notes.length;

            if (notes.length === 0) {
                stream.innerHTML = '<div style="color: #94a3b8; font-style: italic; text-align: center; padding: 16px; font-family: serif; font-size: 0.9rem;">暂无便签，点击右上角「贴张便签」写下第一句感想吧...</div>';
                return;
            }

            notes.forEach(n => {
                const card = document.createElement('div');
                card.className = 'note-card';

                const authorName = (n.author || userSettings.companionName).trim();
                const timeStr = (n.created_at || '').substring(0, 16).replace('T', ' ');

                card.innerHTML = `
                    <div class="note-author-header">
                        <span class="note-author-name">${escapeHtml(authorName)}：</span>
                        <div class="note-header-right">
                            <span class="note-time-label">${timeStr}</span>
                            <button class="note-delete-btn" title="删除便签" onclick="deleteNoteWithConfirm(${n.id})">
                                <svg class="svg-icon" width="12" height="12" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="note-body-text">${escapeHtml(n.content.trim())}</div>
                `;
                stream.appendChild(card);
            });
        }

        async function loadProjectNotes(pid) {
            try {
                const res = await fetch('/api/architecture/current');
                const data = await res.json();
                if (data.status === 'success' && data.notes) {
                    currentNotes = data.notes;
                    renderNotes(currentNotes);
                }
            } catch (err) {
                console.error('Failed to load project notes:', err);
            }
        }

        async function deleteNoteWithConfirm(noteId) {
            if (!confirm('请确认是否删除该便签？此操作不可撤销。')) {
                return;
            }
            try {
                const res = await fetch(`/api/architecture/notes/${noteId}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.status === 'success') {
                    currentNotes = currentNotes.filter(n => n.id !== noteId);
                    renderNotes(currentNotes);
                    showToast('便签已删除');
                } else {
                    showToast('删除失败: ' + (data.detail || '未知错误'), 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('删除失败，请稍后重试', 'error');
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Toggle Notes Collapse (Properly hides all notes without duplicate banner)
        function toggleNotesCollapse() {
            isNotesCollapsed = !isNotesCollapsed;
            const stream = document.getElementById('notesStream');
            const txt = document.getElementById('toggleNotesText');
            const icon = document.getElementById('toggleNotesIcon');

            if (isNotesCollapsed) {
                stream.classList.add('collapsed');
                txt.innerText = '展开便签';
                icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
            } else {
                stream.classList.remove('collapsed');
                txt.innerText = '收起便签';
                icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
            }
        }

        // Toggle '贴张便签' Input Box Visibility
        function toggleAddNoteBox() {
            const card = document.getElementById('noteInputCard');
            const isActive = card.classList.contains('active');
            if (isActive) {
                card.classList.remove('active');
            } else {
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth' });
                document.getElementById('noteInput').focus();
            }
        }

        async function submitNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) {
                showToast('请先输入便签内容...');
                return;
            }
            if (!currentProject) return;

            try {
                const res = await fetch('/api/architecture/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentProject.id,
                        content: text,
                        author: userSettings.userName
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    input.value = '';
                    document.getElementById('noteInputCard').classList.remove('active');
                    currentNotes.push(data.note);
                    if (isNotesCollapsed) toggleNotesCollapse();
                    renderNotes(currentNotes);
                    showToast('便签已贴好！');
                }
            } catch (err) {
                console.error(err);
                showToast('提交便签失败');
            }
        }

        async function toggleHeroFavorite() {
            if (!currentProject) return;
            try {
                let tags = null;
                const heroBtn = document.getElementById('heroFavBtn');
                const willFavorite = !heroBtn.classList.contains('active');
                if (willFavorite) {
                    const prefill = (currentProject.tags || []).slice(0, 3).join(', ');
                    const tagsInput = prompt('为这座建筑添加分类标签（可选，多个标签用逗号隔开，如：清水混凝土, 光影, 教堂）：', prefill);
                    if (tagsInput !== null && tagsInput.trim()) {
                        tags = tagsInput.split(/[,， ]+/).map(t => t.trim()).filter(Boolean);
                    } else if (tagsInput !== null) {
                        tags = (currentProject.tags || []).slice(0, 3);
                    }
                }

                const res = await fetch('/api/architecture/favorite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentProject.id,
                        structured_title: currentProject.structured_title,
                        favorited_by: 'User',
                        tags: tags
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    if (data.is_favorite) {
                        heroBtn.classList.add('active');
                        showToast('已加入建筑收藏');
                    } else {
                        heroBtn.classList.remove('active');
                        showToast('已取消收藏');
                    }
                    await loadCarouselList();
                }
            } catch (err) {
                console.error(err);
            }
        }

        let currentSelectedTag = null;
        let loadedFavorites = [];

        // Drawer Operations (History / Favorites / Settings)
        async function openDrawer(mode) {
            currentDrawerMode = mode;
            const overlay = document.getElementById('drawerOverlay');
            const title = document.getElementById('drawerTitle');
            const tabHist = document.getElementById('tabHistoryBtn');
            const tabFav = document.getElementById('tabFavBtn');
            const tabSet = document.getElementById('tabSettingsBtn');
            const searchWrap = document.getElementById('drawerSearchWrap');
            const tagFiltersEl = document.getElementById('drawerTagFilters');

            tabHist.classList.remove('active');
            tabFav.classList.remove('active');
            tabSet.classList.remove('active');
            searchWrap.style.display = 'none';
            tagFiltersEl.style.display = 'none';

            if (mode === 'history') {
                tabHist.classList.add('active');
                title.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> <span>历史足迹</span>';
                await loadHistoryList();
            } else if (mode === 'favorites') {
                tabFav.classList.add('active');
                title.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> <span>建筑收藏</span>';
                searchWrap.style.display = 'flex';
                tagFiltersEl.style.display = 'flex';
                const searchInp = document.getElementById('favSearchInput');
                if (searchInp) searchInp.value = '';
                const clearBtn = document.getElementById('favSearchClearBtn');
                if (clearBtn) clearBtn.style.display = 'none';
                currentSelectedTag = null;
                await loadFavoriteTagChips();
                await loadFavoritesList();
            } else if (mode === 'settings') {
                tabSet.classList.add('active');
                title.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> <span>设置与使用说明</span>';
                renderSettingsPanel();
            }

            overlay.classList.add('open');
        }

        async function loadFavoriteTagChips() {
            const container = document.getElementById('drawerTagFilters');
            try {
                const res = await fetch('/api/architecture/favorite-tags');
                const data = await res.json();
                const tags = (data.status === 'success' && data.tags) ? data.tags : [];
                
                container.innerHTML = '';
                const allBtn = document.createElement('button');
                allBtn.className = `tag-chip ${!currentSelectedTag ? 'active' : ''}`;
                allBtn.innerText = '全部';
                allBtn.onclick = () => selectFavoriteTag(null);
                container.appendChild(allBtn);

                tags.forEach(t => {
                    const btn = document.createElement('button');
                    btn.className = `tag-chip ${currentSelectedTag === t ? 'active' : ''}`;
                    btn.innerText = '#' + t;
                    btn.onclick = () => selectFavoriteTag(t);
                    container.appendChild(btn);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function handleFavSearchInput() {
            const query = (document.getElementById('favSearchInput').value || '').trim();
            const clearBtn = document.getElementById('favSearchClearBtn');
            if (clearBtn) clearBtn.style.display = query ? 'flex' : 'none';
            filterAndRenderFavorites();
        }

        function clearFavSearch() {
            const input = document.getElementById('favSearchInput');
            if (input) input.value = '';
            const clearBtn = document.getElementById('favSearchClearBtn');
            if (clearBtn) clearBtn.style.display = 'none';
            filterAndRenderFavorites();
        }

        function selectFavoriteTag(tag) {
            currentSelectedTag = tag;
            loadFavoriteTagChips();
            filterAndRenderFavorites();
        }

        function filterAndRenderFavorites() {
            const searchVal = (document.getElementById('favSearchInput')?.value || '').trim().toLowerCase();
            const cleanQuery = searchVal.startsWith('#') ? searchVal.slice(1).trim() : searchVal;

            let filtered = loadedFavorites;

            // 1. Tag chip filter
            if (currentSelectedTag) {
                filtered = filtered.filter(item => {
                    const tags = (item.tags || []).map(t => String(t).toLowerCase());
                    return tags.includes(currentSelectedTag.toLowerCase());
                });
            }

            // 2. Keyword query filter (title, architect, country, city, location, tags, notes)
            if (cleanQuery) {
                filtered = filtered.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    const titleZh = (item.title_zh || '').toLowerCase();
                    const sTitle = (item.structured_title || '').toLowerCase();
                    const sTitleZh = (item.structured_title_zh || '').toLowerCase();
                    const architect = (item.architect || '').toLowerCase();
                    const location = (item.location || '').toLowerCase();
                    const locationZh = (item.location_zh || '').toLowerCase();
                    const note = (item.note || '').toLowerCase();
                    const tags = (item.tags || []).map(t => String(t).toLowerCase());

                    return title.includes(cleanQuery)
                        || titleZh.includes(cleanQuery)
                        || sTitle.includes(cleanQuery)
                        || sTitleZh.includes(cleanQuery)
                        || architect.includes(cleanQuery)
                        || location.includes(cleanQuery)
                        || locationZh.includes(cleanQuery)
                        || note.includes(cleanQuery)
                        || tags.some(t => t.includes(cleanQuery));
                });
            }

            renderDrawerItems(filtered, 'favorites', searchVal);
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('tabHistoryBtn').classList.remove('active');
            document.getElementById('tabFavBtn').classList.remove('active');
            document.getElementById('tabSettingsBtn').classList.remove('active');
        }

        async function loadHistoryList() {
            const listEl = document.getElementById('drawerList');
            listEl.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">加载历史记录中...</div>';
            try {
                const res = await fetch('/api/architecture/history');
                const data = await res.json();
                if (data.status === 'success') {
                    renderDrawerItems(data.history || [], 'history');
                }
            } catch (err) {
                listEl.innerHTML = '<div style="color: #ef4444; text-align: center;">加载失败</div>';
            }
        }

        async function loadFavoritesList() {
            const listEl = document.getElementById('drawerList');
            listEl.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">加载收藏中...</div>';
            try {
                const res = await fetch('/api/architecture/favorites');
                const data = await res.json();
                if (data.status === 'success') {
                    loadedFavorites = data.favorites || [];
                    filterAndRenderFavorites();
                }
            } catch (err) {
                listEl.innerHTML = '<div style="color: #ef4444; text-align: center;">加载失败</div>';
            }
        }

        function renderDrawerItems(items, type, searchQuery = '') {
            const listEl = document.getElementById('drawerList');
            listEl.innerHTML = '';

            if (items.length === 0) {
                let msg = '暂无浏览历史';
                if (type === 'favorites') {
                    if (searchQuery && currentSelectedTag) {
                        msg = `在「${escapeHtml(currentSelectedTag)}」标签下未找到匹配「${escapeHtml(searchQuery)}」的建筑`;
                    } else if (searchQuery) {
                        msg = `未找到与「${escapeHtml(searchQuery)}」相匹配的收藏建筑`;
                    } else if (currentSelectedTag) {
                        msg = `暂无「${escapeHtml(currentSelectedTag)}」标签的建筑收藏`;
                    } else {
                        msg = '收藏夹还是空的，在喜欢的建筑右上角点击收藏吧';
                    }
                }
                listEl.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px 20px; font-family: serif; font-style: italic;">${msg}</div>`;
                return;
            }

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'drawer-item';
                div.onclick = () => switchToProject(item.project_id || item.id);

                const isFav = Boolean(item.is_favorite);
                let titleText = item.structured_title || item.title || '建筑作品';
                if (userSettings.language === 'zh') {
                    titleText = item.structured_title_zh || item.structured_title || item.title_zh || item.title;
                } else if (userSettings.language === 'en') {
                    titleText = item.structured_title_en || item.structured_title || item.title_en || item.title;
                }
                const subText = (item.architect ? item.architect + ' · ' : '') + (item.year ? (userSettings.language === 'en' ? item.year : item.year + '年') : '');

                let tagsHtml = '';
                if (item.tags && Array.isArray(item.tags) && item.tags.length > 0) {
                    tagsHtml = `<div class="drawer-item-tags">${item.tags.map(t => `<span class="item-tag-badge">#${escapeHtml(t)}</span>`).join('')}</div>`;
                }

                div.innerHTML = `
                    <img class="drawer-item-thumb" src="${escapeHtml(item.cover_image || '')}" alt="thumb">
                    <div class="drawer-item-info">
                        <div class="drawer-item-title">${escapeHtml(titleText)}</div>
                        <div class="drawer-item-sub">${escapeHtml(subText)}</div>
                        ${tagsHtml}
                    </div>
                    <button class="drawer-item-fav-btn ${isFav ? 'active' : ''}" title="收藏">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </button>
                `;
                const favBtn = div.querySelector('.drawer-item-fav-btn');
                if (favBtn) {
                    favBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleDrawerItemFavorite(item.project_id || item.id, titleText, favBtn);
                    });
                }
                listEl.appendChild(div);
            });
        }

        async function toggleDrawerItemFavorite(pid, structuredTitle, btnEl) {
            try {
                const res = await fetch('/api/architecture/favorite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: pid,
                        structured_title: structuredTitle,
                        favorited_by: 'User'
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    if (data.is_favorite) {
                        btnEl.classList.add('active');
                        showToast('已加入收藏');
                    } else {
                        btnEl.classList.remove('active');
                        showToast('已取消收藏');
                    }
                    if (currentProject && currentProject.id === pid) {
                        const heroBtn = document.getElementById('heroFavBtn');
                        if (data.is_favorite) heroBtn.classList.add('active');
                        else heroBtn.classList.remove('active');
                    }
                    await loadCarouselList();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function switchToProject(pid) {
            try {
                const res = await fetch('/api/architecture/current', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id: pid })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    currentProject = data.project;
                    currentNotes = data.notes || [];
                    renderHero(currentProject, data.is_favorite);
                    renderNotes(currentNotes);
                    closeDrawer();
                    if (carouselProjects.length > 0) {
                        const idx = carouselProjects.findIndex(p => p.id === currentProject.id);
                        carouselCurrentIndex = idx;
                    }
                    updateCarouselBadge();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Render Settings & Manual Panel
        function renderSettingsPanel() {
            const listEl = document.getElementById('drawerList');
            listEl.innerHTML = `
                <div class="settings-group">
                    <div class="settings-group-title">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span>双方称谓设定</span>
                    </div>
                    <div class="settings-field">
                        <label>你的名字 / 昵称：</label>
                        <input type="text" class="settings-input" id="setUserName" value="${escapeHtml(userSettings.userName)}">
                    </div>
                    <div class="settings-field">
                        <label>AI 伴侣名字：</label>
                        <input type="text" class="settings-input" id="setCompanionName" value="${escapeHtml(userSettings.companionName)}">
                    </div>
                    <button class="btn btn-secondary" onclick="saveNameSettings()" style="width: 100%; justify-content: center; margin-top: 4px;">保存称呼</button>
                </div>

                <div class="settings-group">
                    <div class="settings-group-title">
                        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                        <span>语言与文本展示</span>
                    </div>
                    <div class="radio-options">
                        <div class="radio-chip ${userSettings.language === 'zh' ? 'active' : ''}" onclick="setLanguage('zh')">纯中文</div>
                        <div class="radio-chip ${userSettings.language === 'bilingual' ? 'active' : ''}" onclick="setLanguage('bilingual')">中英双语</div>
                        <div class="radio-chip ${userSettings.language === 'en' ? 'active' : ''}" onclick="setLanguage('en')">原生英文</div>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-group-title">
                        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span>系统说明与使用指南</span>
                    </div>
                    <div class="guide-box">
                        <div class="guide-section">
                            <div class="guide-heading">一、系统定位与数据来源</div>
                            <div class="guide-text">本空间为用户与伴侣共同构建的私人建筑审美与生活记录模块。数据来源于 ArchDaily 公开建筑索引与结构化信息库，收录涵盖全球 6.5 万余座当代与经典建筑项目。</div>
                        </div>

                        <div class="guide-section">
                            <div class="guide-heading">二、核心功能概览</div>
                            <div class="guide-text">
                                • <b>腰部画廊翻阅</b>：展品腰部文字说明两侧设有左右翻页按键（&lt; 与 &gt;），可在收藏夹与浏览历史中步进切换，大图、标题、中英简介、原文链接、便签与收藏状态全量联动。<br>
                                • <b>全中文模式支持</b>：语言选择「纯中文」时，不仅简介翻译为中文，建筑标题、结构化索引（[国家·城市] 建筑名 · 事务所）及坐标地点均自动切换为中文展示。<br>
                                • <b>纸质便签与单条删除</b>：大图正下方可点击「贴张便签」发表感想，每条便签支持点击小垃圾桶按钮并在确认后安全删除；支持一键全部收起或展开。<br>
                                • <b>漫游与安利推荐</b>：点击顶栏「漫游」标签可随机探索新奇建筑；点击「转给他」将即时置顶于大图并加入推荐队列。
                            </div>
                        </div>

                        <div class="guide-section">
                            <div class="guide-heading">三、AI 伴侣端 MCP 工具套件</div>
                            <div class="guide-text">
                                后端已为 AI 伴侣部署独立的 Architecture MCP 服务（建筑漫游），伴侣可自主调用以下接口：<br>
                                • <code>search_architecture</code>：按风格、城市、年份或关键词检索全球建筑（支持多模态视觉赏析）；<br>
                                • <code>random_architecture</code>：自主漫游建筑库探索灵感；<br>
                                • <code>get_current_display</code>：读取大图当前展示的建筑信息与多视角立面图；<br>
                                • <code>write_note</code>：在大图下方回复并贴上纸质便签；<br>
                                • <code>check_recommendations</code>：读取伴侣通过「转给他」安利推荐的建筑列表；<br>
                                • <code>share_to_big_display</code>：搜寻建筑并推送至前端大图展品，伴随专属便签；<br>
                                • <code>favorite_architecture</code> / <code>list_favorite_architectures</code>：管理与检索结构化建筑收藏（支持多标签分类筛选）。
                            </div>
                        </div>

                        <div class="guide-section">
                            <div class="guide-heading">四、版权与非商业声明</div>
                            <div class="guide-text">本系统展示的所有建筑摄影、设计图纸及文本描述版权均归原建筑师、摄影师及原版权方所有。本模块仅供个人非营利性学习、建筑审美交流与伴侣陪伴使用，严禁用于任何商业用途或公开传播。</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveNameSettings() {
            const u = document.getElementById('setUserName').value.trim() || '我';
            const c = document.getElementById('setCompanionName').value.trim() || 'AI伴侣';
            userSettings.userName = u;
            userSettings.companionName = c;
            localStorage.setItem('dhome_arch_username', u);
            localStorage.setItem('dhome_arch_companion', c);
            showToast('称谓已保存！');
            renderNotes(currentNotes);
        }

        function setLanguage(lang) {
            userSettings.language = lang;
            localStorage.setItem('dhome_arch_lang', lang);
            renderSettingsPanel();
            if (currentProject) renderHero(currentProject, isFavorite(currentProject.id));
            if (currentDrawerMode === 'history') loadHistoryList();
            if (currentDrawerMode === 'favorites') loadFavoritesList();
            if (currentRandomProject) renderModalContent(currentRandomProject, isFavorite(currentRandomProject.id));
            showToast(`已切换为：${lang === 'zh' ? '纯中文' : lang === 'bilingual' ? '中英双语' : '原生英文'}`);
        }

        function isFavorite(pid) {
            const btn = document.getElementById('heroFavBtn');
            return btn.classList.contains('active');
        }

        // "漫游" (Browse Random Project Modal - No '设为展品' button)
        async function openRandomModal() {
            document.getElementById('randomModal').classList.add('open');
            await fetchNextRandom();
        }

        function closeRandomModal(e) {
            if (!e || e.target.id === 'randomModal' || e.target.closest('.drawer-close') || e.target.innerText === '关闭') {
                document.getElementById('randomModal').classList.remove('open');
            }
        }

        async function fetchNextRandom() {
            const titleEl = document.getElementById('modalStructuredTitle');
            titleEl.innerText = '[正在漫游探索中...]';
            try {
                const res = await fetch('/api/architecture/random');
                const data = await res.json();
                if (data.status === 'success') {
                    currentRandomProject = data.project;
                    renderModalContent(currentRandomProject, data.is_favorite);
                }
            } catch (err) {
                console.error(err);
                titleEl.innerText = '[加载失败，请再抽一次]';
            }
        }

        function renderModalContent(p, isFav) {
            let structuredTitle = p.structured_title || p.title;
            let displayTitle = p.title || '建筑作品';
            let displayLocation = p.location || p.city || p.country || '全球';

            if (userSettings.language === 'zh') {
                structuredTitle = p.structured_title_zh || p.structured_title || p.title_zh || p.title;
                displayTitle = p.title_zh || p.title || '建筑作品';
                displayLocation = p.location_zh || p.location || p.city || p.country || '全球';
            } else if (userSettings.language === 'en') {
                structuredTitle = p.structured_title_en || p.structured_title || p.title_en || p.title;
                displayTitle = p.title_en || p.title || 'Architecture';
                displayLocation = p.location_en || p.location || p.city || p.country || 'Global';
            } else if (userSettings.language === 'bilingual') {
                structuredTitle = p.structured_title_zh || p.structured_title;
                displayTitle = (p.title_zh && p.title_en && p.title_zh !== p.title_en)
                    ? `${p.title_zh} / ${p.title_en}`
                    : (p.title_zh || p.title);
                displayLocation = (p.location_zh && p.location_en && p.location_zh !== p.location_en)
                    ? `${p.location_zh} (${p.location_en})`
                    : (p.location_zh || p.location);
            }

            document.getElementById('modalStructuredTitle').innerText = structuredTitle;
            document.getElementById('modalTitle').innerText = displayTitle;
            document.getElementById('modalImage').src = p.cover_image || '';
            document.getElementById('modalArchitect').innerText = p.architect || '未知建筑师';
            document.getElementById('modalLocation').innerText = displayLocation;
            document.getElementById('modalYear').innerText = p.year ? (userSettings.language === 'en' ? p.year : p.year + '年') : (userSettings.language === 'en' ? 'Recent' : '近代');

            const descEl = document.getElementById('modalDesc');
            const linkEl = document.getElementById('modalSourceLink');

            let descText = '';
            const zhText = p.description_zh || p.description || '';
            const enText = p.description_en || '';

            if (userSettings.language === 'en') {
                descText = enText || zhText;
            } else if (userSettings.language === 'bilingual' && zhText && enText && zhText !== enText) {
                descText = `${zhText}\n\n[EN] ${enText}`;
            } else {
                descText = zhText || enText || '精选现代建筑设计作品。';
            }

            descEl.innerText = descText;

            if (p.source_url) {
                linkEl.href = p.source_url;
                linkEl.style.display = 'inline-flex';
            } else {
                linkEl.style.display = 'none';
            }

            const favBtn = document.getElementById('modalFavBtn');
            if (isFav) favBtn.classList.add('active');
            else favBtn.classList.remove('active');
        }

        async function toggleModalFavorite() {
            if (!currentRandomProject) return;
            try {
                let tags = null;
                const modalBtn = document.getElementById('modalFavBtn');
                const willFavorite = !modalBtn.classList.contains('active');
                if (willFavorite) {
                    const prefill = (currentRandomProject.tags || []).slice(0, 3).join(', ');
                    const tagsInput = prompt('为这座建筑添加分类标签（可选，多个标签用逗号隔开，如：清水混凝土, 光影, 教堂）：', prefill);
                    if (tagsInput !== null && tagsInput.trim()) {
                        tags = tagsInput.split(/[,， ]+/).map(t => t.trim()).filter(Boolean);
                    } else if (tagsInput !== null) {
                        tags = (currentRandomProject.tags || []).slice(0, 3);
                    }
                }

                const res = await fetch('/api/architecture/favorite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentRandomProject.id,
                        structured_title: currentRandomProject.structured_title,
                        favorited_by: 'User',
                        tags: tags
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    if (data.is_favorite) {
                        modalBtn.classList.add('active');
                        showToast('已加入你的建筑收藏');
                    } else {
                        modalBtn.classList.remove('active');
                        showToast('已取消收藏');
                    }
                    await loadCarouselList();
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Daemon Shares Notification Polling
        let latestDaemonShare = null;

        async function checkDaemonShares() {
            try {
                const res = await fetch('/api/architecture/ai-shares?unread_only=true');
                const data = await res.json();
                if (data.status === 'success' && data.shares && data.shares.length > 0) {
                    latestDaemonShare = data.shares[0];
                    const banner = document.getElementById('daemonShareBanner');
                    const textEl = document.getElementById('daemonShareText');
                    const sTitle = latestDaemonShare.structured_title || latestDaemonShare.title || '建筑作品';
                    const cName = userSettings.companionName || 'AI伴侣';
                    textEl.innerText = `收到来自 ${cName} 的 ${data.shares.length} 个新分享！「${sTitle}」`;
                    banner.style.display = 'flex';
                } else {
                    const banner = document.getElementById('daemonShareBanner');
                    if (banner) banner.style.display = 'none';
                }
            } catch (err) {
                // quiet background poll
            }
        }

        async function viewDaemonShare() {
            if (!latestDaemonShare) return;
            const pid = latestDaemonShare.project_id;
            try {
                await fetch('/api/architecture/ai-shares/mark-all-read', { method: 'POST' });
            } catch (e) {}
            dismissDaemonShare();
            await switchToProject(pid);
            showToast('已切换至分享建筑，快来看看便签吧！');
            const stream = document.getElementById('notesStream');
            if (stream) {
                stream.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function dismissDaemonShare() {
            const banner = document.getElementById('daemonShareBanner');
            if (banner) banner.style.display = 'none';
        }

        // "转给他" (Sets immediately to Big Hero Display + forwards to Companion)
        async function recommendCurrentRandomToDaemon() {
            if (!currentRandomProject) return;
            try {
                await switchToProject(currentRandomProject.id);

                const res = await fetch('/api/architecture/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_id: currentRandomProject.id,
                        user_note: `${userSettings.userName}在建筑漫游里看到了「${currentRandomProject.structured_title}」，特意安利给你！快去看看并给她留张便签吧~`
                    })
                });

                closeRandomModal();
                showToast(`已展示在大图，并成功转给 ${userSettings.companionName}！他稍后会来看~`);
                await loadCarouselList();
            } catch (err) {
                console.error(err);
                showToast('转交推荐失败');
            }
        }

        // First-Time Onboarding Setup
        function checkFirstTimeVisit() {
            const storedUser = localStorage.getItem('dhome_arch_username');
            const storedCompanion = localStorage.getItem('dhome_arch_companion');
            if (!storedUser || !storedCompanion) {
                const modal = document.getElementById('onboardingModal');
                if (modal) modal.classList.add('open');
                const uInput = document.getElementById('onboardUserName');
                const cInput = document.getElementById('onboardCompanionName');
                if (uInput) uInput.value = storedUser || '我';
                if (cInput) cInput.value = storedCompanion || 'AI伴侣';
            }
        }

        function finishOnboarding() {
            const uName = (document.getElementById('onboardUserName').value || '我').trim();
            const cName = (document.getElementById('onboardCompanionName').value || 'AI伴侣').trim();
            userSettings.userName = uName;
            userSettings.companionName = cName;
            localStorage.setItem('dhome_arch_username', uName);
            localStorage.setItem('dhome_arch_companion', cName);

            const uInput = document.getElementById('settingUserName');
            const cInput = document.getElementById('settingCompanionName');
            if (uInput) uInput.value = uName;
            if (cInput) cInput.value = cName;

            const modal = document.getElementById('onboardingModal');
            if (modal) modal.classList.remove('open');
            showToast(`设置成功！欢迎开启建筑漫游`);
            if (currentProject) {
                renderHero(currentProject, document.getElementById('heroFavBtn').classList.contains('active'));
            }
        }

        // Initial Boot
        checkFirstTimeVisit();
        loadCurrentProject();
        checkDaemonShares();
        setInterval(checkDaemonShares, 25000);
    </script>
</body>
</html>
